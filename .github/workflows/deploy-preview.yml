name: Deploy preview Worker

on:
  push:
    branches:
      - improvements/security-and-performance
    paths:
      - .github/workflows/deploy-preview.yml
      - wrangler.jsonc
      - src/**
      - index.html
      - app.js
      - styles.css
      - assets/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ensd-arabic-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/improvements/security-and-performance'
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: improvements/security-and-performance

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Deploy isolated preview Worker
        run: npx wrangler deploy --name ensd-arabic-praimery-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
